# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: search-ingest-crawler
metadata:
  template: search-ingest-crawler@1.0.0

# The search website runs as a Container App (native azd service). The crawler Job and
# AI Search indexer are handled by the postprovision hook below (Jobs aren't azd services).
services:
  web:
    project: ./web
    language: docker
    host: containerapp
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      continueOnError: false
      interactive: false
    posix:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      continueOnError: false
      interactive: false
